on:
  push:
    branches:
    - 'dev'
    - 'bods-two'
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        default: nextjs
        type: choice
        options:
        - django
        - nextjs

name: 'dev_deployment'

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: ./

env:
  ECR_REPOSITORY_NAME: ${{ secrets.ECR_REPOSITORY }}
  ECR_BASE_REPOSITORY_NAME: ${{ secrets.ECR_BASE_REPOSITORY }}
  ENVIRONMENT_NAME: dev
  AWS_REGION: ${{ vars.AWS_REGION }}
  BODS_DEFAULT_GITHUB_ACTIONS_ASSUME_ROLE_ARN: ${{ vars.BODS_DEFAULT_GITHUB_ACTIONS_ASSUME_ROLE_ARN }}
  PROD_ASSUME_ROLE_ARN: ${{ vars.PROD_ASSUME_ROLE_ARN }}

jobs:
  dev_deployment:
    name: 'dev_deployment'
    runs-on: ubuntu-latest
    environment:
      name: dev

    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3

    - name: Detect service version changes
      id: deploy-changes
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # 4.0.1
      with:
        filters: |
          django:
           - version.txt
          nextjs:
           - bods-nextjs/package.json

    # Configure AWS credentials against the BODS Shared-Services account
    - name: Configure AWS credentials in Shared-Services
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # 6.2.0
      with:
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ env.BODS_DEFAULT_GITHUB_ACTIONS_ASSUME_ROLE_ARN }}
        role-session-name: ${{ env.ENVIRONMENT_NAME }}-deployment
        role-duration-seconds: 3600
        role-skip-session-tagging: true

    # Assume a role into the BODS-PROD account
    - name: Configure AWS Credentials in bodds-prod
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # 6.2.0
      with:
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ env.PROD_ASSUME_ROLE_ARN }}
        role-session-name: ${{ env.ENVIRONMENT_NAME }}-deployment
        role-duration-seconds: 3600
        role-skip-session-tagging: true
        role-chaining: true

    - name: Login to Amazon ECR
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # 2.1.5

    - id: set-version-number
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      run: |
        TEXT=$(cat ./version.txt)
        if [[ "${{ github.ref }}" == "refs/heads/bods-two" || "${{ inputs.service }}" == "nextjs" ]]; then
          TEXT="${TEXT}-$(date -u +'%Y%m%d%H%M%S')-${GITHUB_SHA::7}"
        fi
        echo "version=${TEXT//'%'/'%25'}" >> $GITHUB_OUTPUT

    - id: echo-version
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django')
      run: |
        echo ${{ steps.set-version-number.outputs.version }}

    - name: Check if Image exists in Amazon ECR
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      id: check-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ env.ECR_REPOSITORY_NAME }}
        IMAGE_TAG: ${{ steps.set-version-number.outputs.version }}
      run: |
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        if docker manifest inspect $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG >/dev/null; then
            echo "The image $IMAGE_TAG already exists in the $ECR_REPOSITORY Repository"
            exit 1
        else
            echo "Build and push docker image with that tag $IMAGE_TAG "
        fi

    - name: Base Image Changes
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # 4.0.1
      id: base-image-changes
      with:
        filters: |
          django_base:
           - ./docker/production/django_base/Dockerfile

    - name: Build, tag, and push base image to Amazon ECR
      if: ((github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')) && steps.base-image-changes.outputs.django_base == 'true'
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ env.ECR_BASE_REPOSITORY_NAME }}
      run: |
        echo "base_image=$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.set-version-number.outputs.version }}" >> $GITHUB_OUTPUT
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.set-version-number.outputs.version }} -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f ./docker/production/django_base/Dockerfile .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags

    - name: Build, tag, and push image to Amazon ECR
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ env.ECR_REPOSITORY_NAME }}
        ECR_BASE_REPOSITORY: ${{ env.ECR_BASE_REPOSITORY_NAME }}
      run: |
        docker build -t ${{ steps.check-image.outputs.image }} -f ./docker/production/django/Dockerfile --cache-from $ECR_REGISTRY/$ECR_REPOSITORY:latest --build-arg BASE_IMAGE=$ECR_REGISTRY/$ECR_BASE_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags

    - name: Set Next.js image tag
      if: (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      id: nextjs-image
      run: |
        version=$(node --input-type=module -e "import packageJson from './bods-nextjs/package.json' with { type: 'json' }; console.log(packageJson.version)")
        echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:${version}-$(date -u +'%Y%m%d%H%M%S')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

    - name: Build and push Next.js image
      if: (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      env:
        NEXT_PUBLIC_MAPBOX_TOKEN: ${{ vars.MAPBOX_KEY }}
        NEXT_PUBLIC_SUPPORT_PHONE: ${{ vars.SUPPORT_PHONE }}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        NEXT_PUBLIC_AVL_IP_ALLOW_LIST: ${{ vars.AVL_IP_ADDRESS_LIST }}
      run: |
        docker build \
          --tag "${{ steps.nextjs-image.outputs.image }}" \
          --file docker/production/nextjs/Dockerfile \
          --build-arg NEXT_PUBLIC_BODS_BASE_DOMAIN=dev.bus-data.dft.gov.uk \
          --build-arg NEXT_PUBLIC_MAPBOX_TOKEN \
          --build-arg NEXT_PUBLIC_SUPPORT_PHONE \
          --build-arg NEXT_PUBLIC_SUPPORT_EMAIL \
          --build-arg NEXT_PUBLIC_AVL_IP_ALLOW_LIST \
          .
        docker push "${{ steps.nextjs-image.outputs.image }}"

    - name: Logout of Amazon ECR
      if: always() && ((github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs'))
      run: docker logout ${{ steps.login-ecr.outputs.registry }}

    # Configure AWS credentials against the BODS Shared-Services account
    - name: Configure AWS credentials in Shared-Services
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # 6.2.0
      with:
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ env.BODS_DEFAULT_GITHUB_ACTIONS_ASSUME_ROLE_ARN }}
        role-session-name: ${{ env.ENVIRONMENT_NAME }}-deployment
        role-duration-seconds: 3600
        role-skip-session-tagging: true
        unset-current-credentials: true

    # Now assume a role in the Environment Specific account
    - name: Configure AWS Credentials in the environment specific account
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # 6.2.0
      with:
        aws-region: ${{ vars.AWS_REGION }}
        role-to-assume: ${{ vars.ASSUME_ROLE_ARN }}
        role-session-name: testAWSCLISession
        role-duration-seconds: 3600
        role-skip-session-tagging: true
        role-chaining: true

    - name: Update celeryflower task
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      uses: department-for-transport-BODS/.github/actions/update-ecs-task-definition@v1
      with:
        service: celeryflower
        container: celeryflower
        task_definition_family: bodds_celeryflower_${{ env.ENVIRONMENT_NAME }}
        image_id: ${{ steps.check-image.outputs.image }}
        cluster_name: bodds-${{ env.ENVIRONMENT_NAME }}
        wait_for_service_stability: false

    - name: Update celeryworker task
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      uses: department-for-transport-BODS/.github/actions/update-ecs-task-definition@v1
      with:
        service: celeryworker
        container: celeryworker
        task_definition_family: bodds_celeryworker_${{ env.ENVIRONMENT_NAME }}
        image_id: ${{ steps.check-image.outputs.image }}
        cluster_name: bodds-${{ env.ENVIRONMENT_NAME }}
        wait_for_service_stability: false

    - name: Update celerybeat task
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      uses: department-for-transport-BODS/.github/actions/update-ecs-task-definition@v1
      with:
        service: celerybeat
        container: celerybeat
        task_definition_family: bodds_celerybeat_${{ env.ENVIRONMENT_NAME }}
        image_id: ${{ steps.check-image.outputs.image }}
        cluster_name: bodds-${{ env.ENVIRONMENT_NAME }}
        wait_for_service_stability: false

    - name: Update frontend task
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      uses: department-for-transport-BODS/.github/actions/update-ecs-task-definition@v1
      with:
        service: frontend
        container: frontend
        task_definition_family: bodds_frontend_${{ env.ENVIRONMENT_NAME }}
        image_id: ${{ steps.check-image.outputs.image }}
        cluster_name: bodds-${{ env.ENVIRONMENT_NAME }}
        wait_for_service_stability: false

    - name: Update api_frontend task
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      uses: department-for-transport-BODS/.github/actions/update-ecs-task-definition@v1
      with:
        service: api_frontend
        container: frontend
        task_definition_family: bodds_api_frontend_${{ env.ENVIRONMENT_NAME }}
        image_id: ${{ steps.check-image.outputs.image }}
        cluster_name: bodds-${{ env.ENVIRONMENT_NAME }}
        wait_for_service_stability: false

    - name: Update api_frontend_internal task
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      uses: department-for-transport-BODS/.github/actions/update-ecs-task-definition@v1
      with:
        service: api_frontend_internal
        container: frontend
        task_definition_family: bodds_api_frontend_internal_${{ env.ENVIRONMENT_NAME }}
        image_id: ${{ steps.check-image.outputs.image }}
        cluster_name: bodds-${{ env.ENVIRONMENT_NAME }}
        wait_for_service_stability: false

    - name: Update frontend_v2 task
      if: (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      uses: department-for-transport-BODS/.github/actions/update-ecs-task-definition@v1
      with:
        service: frontend_v2
        container: frontend_v2
        task_definition_family: bodds_frontend_v2_${{ env.ENVIRONMENT_NAME }}
        image_id: ${{ steps.nextjs-image.outputs.image }}
        cluster_name: bodds-${{ env.ENVIRONMENT_NAME }}
        wait_for_service_stability: false

    - name: Update pg_migration
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django')
      uses: "./.github/workflows/templates/register_task_def"
      with:
        service: pg_migration
        container: db-migrate
        environment: ${{ env.ENVIRONMENT_NAME }}
        image_id: ${{ steps.check-image.outputs.image }}

    - name: Update pg_superuser
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django')
      uses: "./.github/workflows/templates/register_task_def"
      with:
        service: pg_superuser
        container: pg-superuser
        environment: ${{ env.ENVIRONMENT_NAME }}
        image_id: ${{ steps.check-image.outputs.image }}

    - name: Wait for ECS service stability
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      uses: department-for-transport-BODS/.github/actions/wait-for-ecs-service-stability@v1
      with:
        cluster_name: bodds-${{ env.ENVIRONMENT_NAME }}
        service_names: 'celeryflower celeryworker celerybeat frontend api_frontend api_frontend_internal'

    - name: Wait for frontend_v2 service stability
      if: (github.ref == 'refs/heads/bods-two' && steps.deploy-changes.outputs.nextjs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'nextjs')
      uses: department-for-transport-BODS/.github/actions/wait-for-ecs-service-stability@v1
      with:
        cluster_name: bodds-${{ env.ENVIRONMENT_NAME }}
        service_names: frontend_v2

    - name: Obtain SSM parameters for pg migration
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django')
      id: params
      shell: bash
      run: |
        security_group_ids=`aws ssm get-parameter --name "/bodds/${{ env.ENVIRONMENT_NAME }}/pg-migration-sg-ids" \
          | jq -r '.Parameter.Value'`
        subnet_ids=`aws ssm get-parameter --name "/bodds/${{ env.ENVIRONMENT_NAME }}/private-subnets" \
          | jq -r '.Parameter.Value'`

        echo "SECURITY_GROUPS=${security_group_ids}" >> "$GITHUB_OUTPUT"
        echo "SUBNETS=${subnet_ids}" >> "$GITHUB_OUTPUT"

    - name: Run pg migration
      if: (github.ref == 'refs/heads/dev' && steps.deploy-changes.outputs.django == 'true') || (github.event_name == 'workflow_dispatch' && inputs.service == 'django')
      uses: "./.github/workflows/templates/run_pg_migration_task"
      with:
        subnets: ${{ steps.params.outputs.SUBNETS }}
        security_groups: ${{ steps.params.outputs.SECURITY_GROUPS }}
        environment: ${{ env.ENVIRONMENT_NAME }}
