# TEMPORARY: Remove after dependency remediation validation passes.
name: Temporary Dependency PR Validation

on:
  push:
    branches:
      - dev-vulnerability-ticket-next-js

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgis/postgis:13-3.4
        env:
          POSTGRES_DB: transit_odp
          POSTGRES_USER: transit_odp
          POSTGRES_PASSWORD: transit_odp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transit_odp -d transit_odp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:3.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3

      - name: Build test dependencies image
        run: |
          docker build \
            --tag bods-python-dependencies:ci \
            --file docker/production/python_dependencies/Dockerfile \
            .

      - name: Run Django tests
        run: |
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE:/app" \
            --workdir /app \
            --entrypoint bash \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=transit_odp \
            -e POSTGRES_USER=transit_odp \
            -e POSTGRES_PASSWORD=transit_odp \
            -e DATABASE_URL=postgis://transit_odp:transit_odp@127.0.0.1:5432/transit_odp \
            -e USE_DOCKER=no \
            -e DJANGO_SETTINGS_MODULE=config.settings.local \
            -e DJANGO_PARENT_HOST=bods.local \
            -e DJANGO_HOST_PORT=8000 \
            -e DJANGO_HOST_SCHEME=http \
            -e EMAIL_HOST=localhost \
            -e SUPPORT_EMAIL=ci@example.com \
            -e SUPPORT_PHONE=0000000000 \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            -e CELERY_BROKER_URL=redis://127.0.0.1:6379/0 \
            -e CELERY_FLOWER_USER=admin \
            -e CELERY_FLOWER_PASSWORD=admin \
            -e CELERY_BROKER_VISIBILITY_TIMEOUT=18000 \
            -e DJANGO_ACCOUNT_ALLOW_REGISTRATION=True \
            -e GOV_NOTIFY_API_KEY=placeholder \
            -e CAVL_URL=http://localhost \
            -e CAVL_VALIDATION_URL=http://localhost \
            -e CAVL_CONSUMER_URL=http://localhost \
            -e AVL_CONSUMER_API_BASE_URL=http://localhost \
            -e AVL_PRODUCER_API_BASE_URL=http://localhost \
            -e AVL_PRODUCER_API_KEY=placeholder \
            -e PTI_START_DATE=2021-04-01 \
            -e PTI_PDF_URL=https://pti.org.uk/system/files/files/TransXChange_UK_PTI_Profile_v1.1.A.pdf \
            -e PTI_ENFORCED_DATE=2021-08-02 \
            -e DQS_URL=http://localhost \
            bods-python-dependencies:ci \
            -lc 'python -m pip install --no-cache-dir distlib==0.3.9 && poetry config virtualenvs.create false && poetry install --no-root && pytest -vv --junitxml=/tmp/junit_report.xml'

  nextjs-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3

      - name: Run Next.js tests
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/bods-nextjs:/app" \
            --workdir /app \
            node:24-slim \
            sh -lc 'npm ci && npm test -- --runInBand'

  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3

      - name: Build Python dependencies image
        run: |
          docker build \
            --tag bods-python-dependencies:ci \
            --file docker/production/python_dependencies/Dockerfile \
            .

      - name: Build Django base image
        run: |
          docker build \
            --tag bods-django-base:ci \
            --file docker/production/django_base/Dockerfile \
            .

      - name: Build Django application image
        run: |
          docker build \
            --build-arg BASE_IMAGE=bods-django-base:ci \
            --tag bods-django:ci \
            --file docker/production/django/Dockerfile \
            .

      - name: Build Next.js application image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_BODS_BASE_DOMAIN=dev.bus-data.dft.gov.uk \
            --tag bods-nextjs:ci \
            --file docker/production/nextjs/Dockerfile \
            .
